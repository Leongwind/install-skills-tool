name: macOS

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: macos/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: skill-installer-macos-arm64-dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: skill-installer-macos-x64-dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: macos/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      - name: Generate SHA-256 checksum
        run: shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > src-tauri/target/${{ matrix.target }}/release/bundle/dmg/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: macos/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
          if-no-files-found: error
