name: macOS

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: macos/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Verify macOS version metadata
        run: |
          test "$(node -p "require('./package.json').version")" = "0.5.0"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "0.5.0"
          grep -q '^version = "0.5.0"' src-tauri/Cargo.toml
      - run: pnpm run build
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            expected_arch: arm64
            artifact: skill-installer-macos-arm64-dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            expected_arch: x86_64
            artifact: skill-installer-macos-x64-dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: macos/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }}
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      - name: Generate SHA-256 checksum
        run: shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > src-tauri/target/${{ matrix.target }}/release/bundle/dmg/SHA256SUMS.txt
      - name: Verify DMG, bundle metadata, architecture and ad-hoc signature
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          mount_output=$(hdiutil attach "$dmg" -nobrowse -readonly)
          mount_point=$(printf '%s\n' "$mount_output" | awk '/\/Volumes\// {print substr($0, index($0, "/Volumes/")); exit}')
          test -n "$mount_point"
          cleanup() { hdiutil detach "$mount_point" >/dev/null || true; }
          trap cleanup EXIT
          app="$mount_point/Skill Installer.app"
          test -d "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$bundle_id" = "com.leongwind.skillinstaller"
          test "$bundle_version" = "0.5.0"
          executable=$(find "$app/Contents/MacOS" -type f -perm -111 -maxdepth 1 -print -quit)
          test -n "$executable"
          test "$(lipo -archs "$executable")" = "$EXPECTED_ARCH"
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: macos/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
          if-no-files-found: error
