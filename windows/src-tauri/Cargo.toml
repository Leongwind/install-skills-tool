[package]
name = "skill-installer-windows"
version = "0.1.0"
description = "Install Agent Skills across Windows coding agents"
authors = ["Leongwind"]
edition = "2021"

[lib]
name = "skill_installer_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
